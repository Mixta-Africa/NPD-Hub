name: Daily Deadline Check

# ─────────────────────────────────────────────────────────────
# DISABLED SCHEDULE — the authoritative daily cron runs inside GAS
# (dailyDeadlineCheck). This workflow builds its OWN alerts array and
# therefore bypasses two things the GAS path enforces:
#   1. Task-level privacy — it would name private tasks in shared emails
#   2. resolveTaskRecipients() — it would route to product owners, not
#      the reassigned task owners
# Left as a manual-only fallback for when GAS is unavailable. Do NOT
# re-enable the schedule without porting both of those rules across.
# ─────────────────────────────────────────────────────────────
on:
  workflow_dispatch:        # manual trigger only — see note above

jobs:
  check-deadlines:
    runs-on: ubuntu-latest
    steps:
      - name: Run deadline check
        env:
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          GAS_ENDPOINT:          ${{ secrets.GAS_ENDPOINT }}
        run: |
          node << 'EOF'
          const https = require('https');

          function httpsGet(url) {
            return new Promise((resolve, reject) => {
              https.get(url, res => {
                let data = '';
                res.on('data', d => data += d);
                res.on('end', () => resolve(JSON.parse(data)));
              }).on('error', reject);
            });
          }

          function httpsPost(url, payload) {
            return new Promise((resolve, reject) => {
              const body = JSON.stringify(payload);
              const urlObj = new URL(url);
              const opts = {
                hostname: urlObj.hostname,
                path:     urlObj.pathname + urlObj.search,
                method:   'POST',
                headers:  { 'Content-Type': 'text/plain', 'Content-Length': Buffer.byteLength(body) },
              };
              const req = https.request(opts, res => {
                let data = '';
                res.on('data', d => data += d);
                res.on('end', () => {
                  try { resolve(JSON.parse(data)); } catch(e) { resolve({ ok: true, raw: data }); }
                });
              });
              req.on('error', reject);
              req.write(body);
              req.end();
            });
          }

          async function main() {
            const dbUrl  = process.env.FIREBASE_DATABASE_URL;
            const gasUrl = process.env.GAS_ENDPOINT;
            const today  = new Date(); today.setHours(0,0,0,0);
            const THRESHOLD_DAYS = 3; // send alerts for overdue + within 3 days

            console.log('Fetching products and users from Firebase...');
            const [data, usersData] = await Promise.all([
              httpsGet(dbUrl + '/products.json'),
              httpsGet(dbUrl + '/users.json'),
            ]);
            const users = usersData || {};
            if (!data) { console.log('No products found.'); return; }

            const alerts = [];
            const products = Object.values(data);

            products.forEach(prod => {
              if (prod.status === 'archived') return;

              // Handle both new tasks{} and legacy pillars{} formats
              let tasks = [];
              if (prod.tasks && Object.keys(prod.tasks).length > 0) {
                tasks = Object.values(prod.tasks);
              } else if (prod.pillars) {
                tasks = Object.values(prod.pillars).map((pd, i) => ({
                  id:       pd.pillarId || ('p' + (i+1)),
                  title:    pd.name || ('Pillar ' + (i+1)),
                  deadline: pd.deadline,
                  status:   pd.taskStatus || 'on-track',
                  owner:    pd.owner || '',
                  ownerEmails: pd.ownerEmails || [],
                  pillarId: pd.pillarId || null,
                }));
              }

              // Skip if alerts disabled for this product
              if (prod.alertsEnabled === false) return;

              // Recipient: manual override → owner → fallback
              let deptEmails = [];
              if (prod.alertRecipients && prod.alertRecipients.length > 0) {
                deptEmails = prod.alertRecipients;
              } else if (prod.ownerId && users[prod.ownerId]?.email) {
                deptEmails = [users[prod.ownerId].email];
              } else {
                console.log('No recipient for ' + prod.name + ' — skipping');
                return;
              }

              tasks.forEach(task => {
                const taskStatus = task.status || 'on-track';
                // Never alert on complete tasks
                if (taskStatus === 'complete') return;
                const isDelayed = taskStatus === 'delayed';

                let diff = null;
                let daysOverdue = 0;
                if (task.deadline) {
                  const due = new Date(task.deadline); due.setHours(0,0,0,0);
                  diff = Math.round((due - today) / 86400000);
                  daysOverdue = diff < 0 ? Math.abs(diff) : 0;
                }

                // Skip future non-delayed tasks beyond threshold
                if (!isDelayed && diff !== null && diff > THRESHOLD_DAYS) return;
                // Skip tasks with no deadline that are not delayed
                if (!isDelayed && diff === null) return;

                const alertType = diff === null
                  ? 'delayed'
                  : diff < 0  ? 'overdue'
                  : diff === 0 ? 'due'
                  : isDelayed  ? 'delayed'
                  : 'warning';

                alerts.push({
                  productName: prod.name,
                  productId:   prod.id,
                  pillarName:  task.title || task.name || 'Unknown task',
                  pillarId:    task.id,
                  ownerDept:   task.owner || 'Unknown',
                  deptEmails,
                  daysUntil:   diff,
                  daysOverdue,
                  deadline:    task.deadline || null,
                  taskStatus,
                  alertType,
                });
              });
            });

            if (alerts.length === 0) {
              console.log('No alerts to send — all tasks on track.');
              return;
            }

            // Group summary for logging
            const overdue  = alerts.filter(a => a.alertType === 'overdue').length;
            const dueToday = alerts.filter(a => a.alertType === 'due').length;
            const warning  = alerts.filter(a => a.alertType === 'warning').length;
            console.log('Alerts to send: ' + alerts.length + ' (' + overdue + ' overdue, ' + dueToday + ' due today, ' + warning + ' warnings)');

            console.log('Calling GAS...');
            const result = await httpsPost(gasUrl, { action: 'checkDeadlines', alerts });
            console.log('GAS response:', JSON.stringify(result));
            console.log('Done. Emails sent: ' + (result.sent || 0));
          }

          main().catch(err => { console.error('Deadline check failed:', err); process.exit(1); });
          EOF
