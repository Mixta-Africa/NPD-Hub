name: Daily Deadline Check

on:
  schedule:
    - cron: '0 6 * * *'   # 6:00 UTC = 7:00 WAT, every day
  workflow_dispatch:        # allow manual trigger from GitHub Actions UI

jobs:
  check-deadlines:
    runs-on: ubuntu-latest
    steps:
      - name: Run deadline check
        env:
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          GAS_ENDPOINT:          ${{ secrets.GAS_ENDPOINT }}
        run: |
          node << 'EOF'
          const https = require('https');

          function httpsGet(url) {
            return new Promise((resolve, reject) => {
              https.get(url, res => {
                let data = '';
                res.on('data', d => data += d);
                res.on('end', () => resolve(JSON.parse(data)));
              }).on('error', reject);
            });
          }

          function httpsPost(url, payload) {
            return new Promise((resolve, reject) => {
              const body = JSON.stringify(payload);
              const urlObj = new URL(url);
              const opts = {
                hostname: urlObj.hostname,
                path:     urlObj.pathname + urlObj.search,
                method:   'POST',
                headers:  { 'Content-Type': 'text/plain', 'Content-Length': Buffer.byteLength(body) },
              };
              const req = https.request(opts, res => {
                let data = '';
                res.on('data', d => data += d);
                res.on('end', () => {
                  try { resolve(JSON.parse(data)); } catch(e) { resolve({ ok: true, raw: data }); }
                });
              });
              req.on('error', reject);
              req.write(body);
              req.end();
            });
          }

          async function main() {
            const dbUrl  = process.env.FIREBASE_DATABASE_URL;
            const gasUrl = process.env.GAS_ENDPOINT;
            const today  = new Date(); today.setHours(0,0,0,0);
            const THRESHOLD_DAYS = 3; // send alerts for overdue + within 3 days

            console.log('Fetching products from Firebase...');
            const data = await httpsGet(dbUrl + '/products.json');
            if (!data) { console.log('No products found.'); return; }

            const alerts = [];
            const products = Object.values(data);

            products.forEach(prod => {
              if (prod.status === 'archived') return;

              // Handle both new tasks{} and legacy pillars{} formats
              let tasks = [];
              if (prod.tasks && Object.keys(prod.tasks).length > 0) {
                tasks = Object.values(prod.tasks);
              } else if (prod.pillars) {
                tasks = Object.values(prod.pillars).map((pd, i) => ({
                  id:       pd.pillarId || ('p' + (i+1)),
                  title:    pd.name || ('Pillar ' + (i+1)),
                  deadline: pd.deadline,
                  status:   pd.taskStatus || 'on-track',
                  owner:    pd.owner || '',
                  ownerEmails: pd.ownerEmails || [],
                  pillarId: pd.pillarId || null,
                }));
              }

              tasks.forEach(task => {
                if (!task.deadline || task.status === 'complete') return;
                const due  = new Date(task.deadline); due.setHours(0,0,0,0);
                const diff = Math.round((due - today) / (86400000));

                // KEY CHANGE: overdue tasks fire EVERY DAY with no cutoff
                if (diff > THRESHOLD_DAYS) return;

                const daysOverdue = diff < 0 ? Math.abs(diff) : 0;
                alerts.push({
                  productName: prod.name,
                  productId:   prod.id,
                  pillarName:  task.title || task.name || 'Unknown task',
                  pillarId:    task.id,
                  ownerDept:   task.owner || 'Unknown',
                  deptEmails:  task.ownerEmails || [],
                  daysUntil:   diff,
                  daysOverdue,
                  deadline:    task.deadline,
                  alertType:   diff < 0 ? 'overdue' : diff === 0 ? 'due' : 'warning',
                });
              });
            });

            if (alerts.length === 0) {
              console.log('No alerts to send — all tasks on track.');
              return;
            }

            // Group summary for logging
            const overdue  = alerts.filter(a => a.alertType === 'overdue').length;
            const dueToday = alerts.filter(a => a.alertType === 'due').length;
            const warning  = alerts.filter(a => a.alertType === 'warning').length;
            console.log('Alerts to send: ' + alerts.length + ' (' + overdue + ' overdue, ' + dueToday + ' due today, ' + warning + ' warnings)');

            console.log('Calling GAS...');
            const result = await httpsPost(gasUrl, { action: 'checkDeadlines', alerts });
            console.log('GAS response:', JSON.stringify(result));
            console.log('Done. Emails sent: ' + (result.sent || 0));
          }

          main().catch(err => { console.error('Deadline check failed:', err); process.exit(1); });
          EOF
