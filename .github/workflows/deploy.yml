# ─────────────────────────────────────────────────────────────
# NPD Hub — GitHub Actions Deploy
#
# PRIMARY host:  Cloudflare Pages (npd-hub.pages.dev)
#                Cloudflare pulls from this repo and runs build.sh
#                with secrets set in the Cloudflare dashboard.
#
# FALLBACK host: GitHub Pages (mixta-africa.github.io/NPD-Hub/)
#                This workflow keeps GitHub Pages in sync.
# ─────────────────────────────────────────────────────────────

name: Deploy NPD Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject secrets into index.html
        run: |
          cp index.html index.html.bak
          sed -i "s|__FIREBASE_API_KEY__|${{ secrets.FIREBASE_API_KEY }}|g"                       index.html
          sed -i "s|__FIREBASE_AUTH_DOMAIN__|${{ secrets.FIREBASE_AUTH_DOMAIN }}|g"               index.html
          sed -i "s|__FIREBASE_DATABASE_URL__|${{ secrets.FIREBASE_DATABASE_URL }}|g"             index.html
          sed -i "s|__FIREBASE_PROJECT_ID__|${{ secrets.FIREBASE_PROJECT_ID }}|g"                 index.html
          sed -i "s|__FIREBASE_STORAGE_BUCKET__|${{ secrets.FIREBASE_STORAGE_BUCKET }}|g"         index.html
          sed -i "s|__FIREBASE_MESSAGING_SENDER_ID__|${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}|g" index.html
          sed -i "s|__FIREBASE_APP_ID__|${{ secrets.FIREBASE_APP_ID }}|g"                         index.html
          sed -i "s|__GAS_ENDPOINT__|${{ secrets.GAS_ENDPOINT }}|g"                               index.html
          sed -i "s|__SUPER_ADMIN_HASH__|${{ secrets.SUPER_ADMIN_HASH }}|g"                       index.html
          sed -i "s|__GROQ_API_KEY__|${{ secrets.GROQ_API_KEY }}|g"                               index.html
          if grep -q "__FIREBASE_\|__GAS_\|__GROQ_\|__SUPER_" index.html; then
            echo "ERROR: Some placeholders were not replaced — check GitHub Secrets"
            exit 1
          fi
          echo "All secrets injected successfully"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
